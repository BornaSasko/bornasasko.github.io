(()=>{'use strict';const K='bela-blok-private-v1',el=document.getElementById('app'),overlay=document.getElementById('dialog');const blank=()=>({rounds:[],winner:null,created:new Date().toISOString()});const init=()=>({matches:[blank()],active:0,mode:'game',focused:'mi',game:{mi:'',vi:''},zvanje:{mi:'',vi:''},screen:'entry',editing:null,target:1001});let s;try{s=JSON.parse(localStorage.getItem(K))||init()}catch{s=init()}if(!Array.isArray(s.matches)||!s.matches.length)s=init();s.mode=s.mode||'game';s.focused=s.focused||'mi';s.game=s.game||{mi:'',vi:''};s.zvanje=s.zvanje||{mi:'',vi:''};s.screen=s.screen||'entry';s.target=Number(s.target)||1001;const current=()=>s.matches[s.active]||s.matches[0];const sum=(r,k)=>r.reduce((a,b)=>a+b[k].game+b[k].zvanje,0);const calcTotals=()=>({mi:sum(current().rounds,'mi'),vi:sum(current().rounds,'vi')});const fmt=x=>x===''?'—':String(x);function displayed(k){const g=s.game,z=s.zvanje;const base=g[k]!==''?Number(g[k]):g[k==='mi'?'vi':'mi']!==''?162-Number(g[k==='mi'?'vi':'mi']):null;if(base===null)return z[k]===''?'—':String(Number(z[k]));return String(base+(Number(z[k])||0));}function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){alert('Spremanje nije uspjelo. Provjeri slobodan prostor ili Safari postavke.')}}function render(){const totals=calcTotals(),cur=current(),wins={mi:s.matches.filter(m=>m.winner==='mi').length,vi:s.matches.filter(m=>m.winner==='vi').length};el.innerHTML=`<div class="app"><header class="top"><div><h1 class="title">Bela Blok</h1></div><div class="headerbuttons"><button class="iconbutton statbutton" data-act="stats" aria-label="Statistika">▥</button><button class="iconbutton" data-act="settings" aria-label="Postavke">⚙</button></div></header><section class="scoreboard"><div class="team"><label>MI</label><div class="score">${totals.mi}</div><div class="round">Ukupno bodova</div></div><div class="team"><label>VI</label><div class="score">${totals.vi}</div><div class="round">Ukupno bodova</div></div></section>${s.screen==='entry'?entryHTML():listHTML(wins)}<div class="footnote">© Pecinjak 2026</div></div>`;save()}
function entryHTML(){let mode=s.mode,fields=s[mode];return `<div class="switch"><button class="${mode==='game'?'on':''}" data-act="mode" data-value="game">IGRA</button><button class="${mode==='zvanje'?'on':''}" data-act="mode" data-value="zvanje">ZVANJE</button></div><div class="panel"><div class="inputs"><button class="entry ${s.focused==='mi'?'active':''}" data-act="focus" data-value="mi"><small>MI</small><b>${mode==='zvanje'?displayed('mi'):fmt(fields.mi)}</b><span class="zbadge">${Number(s.zvanje.mi)||0}</span></button><button class="entry ${s.focused==='vi'?'active':''}" data-act="focus" data-value="vi"><small>VI</small><b>${mode==='zvanje'?displayed('vi'):mode==='game'&&fields.mi!==''&&fields.vi===''?162-Number(fields.mi):fmt(fields.vi)}</b><span class="zbadge">${Number(s.zvanje.vi)||0}</span></button></div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(n=>`<button class="key ${n==='C'?'back':n==='⌫'?'secondary':''}" data-act="key" data-value="${n}">${n}</button>`).join('')}</div></div><div class="footer"><div class="actions"><button class="secondaryBtn" data-act="list">← Popis</button><button class="primary" data-act="commit">${s.editing!==null?'Spremi izmjene':'✓ Završi rundu'}</button></div></div>`}
function listHTML(wins){const cur=current(),t=calcTotals(),done=!!cur.winner;return `<div class="top"><div><div class="eyebrow">Pregled</div><h2 style="margin:4px 0">Runde ${cur.rounds.length}</h2></div><button class="secondaryBtn" data-act="history">Povijest</button></div><div class="roundlist">${cur.rounds.length?cur.rounds.map((r,i)=>`<div class="roundline"><div class="index">#${i+1}</div><div class="points">${r.mi.game+r.mi.zvanje}<span>${r.mi.game}${r.mi.zvanje?' + '+r.mi.zvanje:''}</span></div><div class="points">${r.vi.game+r.vi.zvanje}<span>${r.vi.game}${r.vi.zvanje?' + '+r.vi.zvanje:''}</span></div><button class="edit" data-act="edit" data-value="${i}">Uredi</button></div>`).join(''):'<div class="empty">Još nema upisanih rundi.</div>'}</div>${done?`<div class="summary"><small>Partija završena · pobjednik ${cur.winner.toUpperCase()}</small><strong>MI ${wins.mi} &nbsp; VI ${wins.vi}</strong><div class="tiny" style="color:#b7d3c7;margin-top:8px">Rezultat partija</div></div>`:''}<div class="footer">${done?'<button class="primary" data-act="newmatch">Nova partija</button>':'<button class="primary" data-act="newround">+ Nova igra</button>'}<div class="actions"><button class="secondaryBtn" data-act="history">Partije</button><button class="secondaryBtn" data-act="undo">Obriši zadnju rundu</button></div></div>`}
function resetEntry(){s.game={mi:'',vi:''};s.zvanje={mi:'',vi:''};s.mode='game';s.focused='mi';s.editing=null}function newRound(){resetEntry();s.screen='entry';render()}
function commit(){const f=s.game,z=s.zvanje;const a=f.mi===''?null:Number(f.mi),b=f.vi===''?null:Number(f.vi);if(a===null&&b===null){toast('Upiši bodove barem jedne ekipe.');return}let mi=a,vi=b;if(mi===null)mi=162-vi;if(vi===null)vi=162-mi;if(!Number.isSafeInteger(mi)||!Number.isSafeInteger(vi)||mi<0||vi<0||mi>162||vi>162){toast('Bodovi igre moraju biti od 0 do 162.');return}const row={mi:{game:mi,zvanje:Number(z.mi)||0},vi:{game:vi,zvanje:Number(z.vi)||0}};const r=current().rounds;if(s.editing!==null)r[s.editing]=row;else r.push(row);const t=calcTotals();current().winner=(t.mi>s.target||t.vi>s.target)?(t.mi===t.vi?null:t.mi>t.vi?'mi':'vi'):null;resetEntry();s.screen='list';render()}
function toast(message){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="modal"><h2>Obavijest</h2><p>${message}</p><button class="primary" data-act="close">U redu</button></div>`}
function confirmBox(title,body,yes){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="modal"><h2>${title}</h2><p>${body}</p><button class="primary" data-act="${yes}">Potvrdi</button><button class="secondaryBtn" data-act="close">Odustani</button></div>`}
function history(){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="modal"><h2>Povijest partija</h2><p class="tiny">Sve partije na ovom uređaju (${s.matches.length}).</p>${s.matches.map((m,i)=>`<div class="historyline"><button class="secondaryBtn historyopen" data-act="openmatch" data-value="${i}"><span>${new Date(m.created).toLocaleDateString('hr-HR')}</span><b>${sum(m.rounds,'mi')} : ${sum(m.rounds,'vi')}</b></button><button class="historydelete" data-act="askDeleteMatch" data-value="${i}" aria-label="Obriši partiju od ${new Date(m.created).toLocaleDateString('hr-HR')}" title="Obriši partiju">🗑</button></div>`).join('')}<button class="primary" data-act="close">Zatvori</button></div>`}
function deleteMatch(i){if(!Number.isInteger(i)||i<0||i>=s.matches.length)return;s.matches.splice(i,1);if(!s.matches.length){s.matches=[blank()];s.active=0;resetEntry();s.screen='entry'}else{if(i<s.active)s.active--;else if(i===s.active)s.active=Math.min(i,s.matches.length-1);resetEntry();s.screen='list'}render();history()}

function statistics(){
  const finished=s.matches.filter(m=>m.winner&&Array.isArray(m.rounds)&&m.rounds.length);
  const match=finished[finished.length-1];
  overlay.classList.remove('hidden');
  if(!match){overlay.innerHTML=`<div class="modal"><h2>Statistika</h2><p>Još nema završene partije. Statistika će biti dostupna nakon što jedna ekipa prijeđe cilj.</p><button class="primary" data-act="close">Zatvori</button></div>`;return;}
  const mi=sum(match.rounds,'mi'),vi=sum(match.rounds,'vi');
  const zm=match.rounds.reduce((n,r)=>n+(Number(r.mi.zvanje)||0),0),zv=match.rounds.reduce((n,r)=>n+(Number(r.vi.zvanje)||0),0);
  const avg=(v)=> (v/match.rounds.length).toLocaleString('hr-HR',{maximumFractionDigits:1});
  const n=match.rounds.length,W=330,H=205,L=36,R=12,T=14,B=31;
  const max=Math.max(100,mi,vi, ...match.rounds.flatMap(r=>[r.mi.game+r.mi.zvanje,r.vi.game+r.vi.zvanje]));
  const cap=Math.ceil(max/100)*100;
  let a=0,b=0;const miSeries=[0],viSeries=[0];
  for(const r of match.rounds){a+=r.mi.game+r.mi.zvanje;b+=r.vi.game+r.vi.zvanje;miSeries.push(a);viSeries.push(b);}
  const X=i=>L+i*(W-L-R)/Math.max(1,n),Y=v=>T+(cap-v)*(H-T-B)/cap;
  const path=arr=>arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  const ygrid=[0,.25,.5,.75,1].map(t=>{const yy=Y(cap*t);return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#c7d8ce" stroke-width="1"/><text x="${L-5}" y="${yy+4}" text-anchor="end" font-size="10" fill="#607b70">${Math.round(cap*t)}</text>`}).join('');
  const xticks=Array.from(new Set([0,Math.floor(n/2),n])).map(i=>`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="11" fill="#607b70">${i}</text>`).join('');
  overlay.innerHTML=`<div class="modal statsmodal"><h2>Statistika</h2><p class="tiny">Zadnja završena partija · ${new Date(match.created).toLocaleDateString('hr-HR')}</p><div class="statsgrid"><div class="statitem"><small>MI · Ukupno bodova</small><strong>${mi}</strong></div><div class="statitem"><small>VI · Ukupno bodova</small><strong>${vi}</strong></div><div class="statitem"><small>MI · Ukupno zvanja</small><strong>${zm}</strong></div><div class="statitem"><small>VI · Ukupno zvanja</small><strong>${zv}</strong></div></div><div class="statsgrid"><div class="statitem"><small>Odigranih rundi</small><strong>${n}</strong></div><div class="statitem"><small>Pobjednik</small><strong>${match.winner.toUpperCase()}</strong></div><div class="statitem"><small>MI · Prosjek po rundi</small><strong>${avg(mi)}</strong></div><div class="statitem"><small>VI · Prosjek po rundi</small><strong>${avg(vi)}</strong></div></div><h3 style="margin:18px 0 6px;font-size:16px">Kretanje rezultata</h3><div class="statschart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kumulativni bodovi po rundama">${ygrid}${xticks}<path d="${path(miSeries)}" fill="none" stroke="#168469" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="${path(viSeries)}" fill="none" stroke="#bb7650" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="statslegend"><span><b style="color:#168469">●</b> MI</span><span><b style="color:#bb7650">●</b> VI</span></div><div class="statsnote" style="text-align:center">X: runda · Y: ukupni bodovi do te runde</div></div><button class="primary" data-act="close">Zatvori</button></div>`;
}
function settings(){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="modal"><h2>Postavke</h2><p>Cilj za pobjedu (pobjeda kada ekipa <b>pređe</b> cilj):</p><input id="target" type="number" min="1" value="${s.target}"><button class="primary" data-act="target">Spremi cilj</button><button class="secondaryBtn" data-act="export">Izvezi sigurnosnu kopiju</button><button class="secondaryBtn" data-act="import">Uvezi sigurnosnu kopiju</button><p class="tiny">Podaci se čuvaju u Safariju / instaliranoj web aplikaciji. Brisanje podataka preglednika može ih izbrisati, zato povremeno izvezi kopiju.</p><button class="secondaryBtn" data-act="close">Zatvori</button></div>`}
function exportJSON(){const blob=new Blob([JSON.stringify({format:'bela-blok-private-v1',data:s},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bela-blok-kopija-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);overlay.classList.add('hidden')}
function run(act,v){if(act.startsWith('deleteMatch:')){deleteMatch(Number(act.slice(12)));return}switch(act){case 'mode':s.mode=v;render();break;case 'focus':s.focused=v;render();break;case 'key':{const f=s[s.mode];let val=String(f[s.focused]||'');if(v==='C')val='';else if(v==='⌫')val=val.slice(0,-1);else if(val.length<9){const candidate=val+v;if(s.mode==='game'&&Number(candidate)>162){return}val=candidate}f[s.focused]=val;render();break}case 'commit':commit();break;case 'list':s.screen='list';render();break;case 'newround':newRound();break;case 'edit':{let r=current().rounds[Number(v)];s.game={mi:String(r.mi.game),vi:String(r.vi.game)};s.zvanje={mi:r.mi.zvanje?String(r.mi.zvanje):'',vi:r.vi.zvanje?String(r.vi.zvanje):''};s.editing=Number(v);s.mode='game';s.focused='mi';s.screen='entry';render();break}case 'newmatch':s.matches.push(blank());s.active=s.matches.length-1;newRound();break;case 'undo':if(!current().rounds.length)return;confirmBox('Izbrisati zadnju rundu?','Ovo će ukloniti posljednji zapis.','doUndo');break;case 'doUndo':current().rounds.pop();current().winner=null;overlay.classList.add('hidden');render();break;case 'history':history();break;case 'stats':statistics();break;case 'askDeleteMatch':{const i=Number(v);if(!Number.isInteger(i)||i<0||i>=s.matches.length)return;const m=s.matches[i];const date=new Date(m.created).toLocaleDateString('hr-HR');confirmBox('Obrisati partiju?',`Partija od ${date} (${sum(m.rounds,'mi')} : ${sum(m.rounds,'vi')}) bit će trajno izbrisana.`, 'deleteMatch:'+i);break}case 'openmatch':s.active=Number(v);resetEntry();s.screen='list';overlay.classList.add('hidden');render();break;case 'settings':settings();break;case 'target':{const n=Number(document.getElementById('target').value);if(Number.isSafeInteger(n)&&n>0){s.target=n;overlay.classList.add('hidden');render()}else toast('Unesi ispravan cilj.');break}case 'export':exportJSON();break;case 'import':document.getElementById('upload').click();break;case 'close':overlay.classList.add('hidden');break}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)run(b.dataset.act,b.dataset.value)});document.getElementById('upload').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const dat=JSON.parse(await f.text());if(dat.format!=='bela-blok-private-v1'||!Array.isArray(dat.data.matches))throw Error('format');s=dat.data;s.active=Math.min(Math.max(0,Number(s.active)||0),s.matches.length-1);s.screen='list';resetEntry();overlay.classList.add('hidden');render()}catch{toast('Datoteka nije valjana sigurnosna kopija.')}e.target.value=''});window.addEventListener('keydown',e=>{if(overlay.classList.contains('hidden')&&s.screen==='entry'&&/^[0-9]$/.test(e.key))run('key',e.key);else if(overlay.classList.contains('hidden')&&s.screen==='entry'&&e.key==='Backspace')run('key','⌫')});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();</script></body></html>
