<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102b2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bela Blok"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Bela Blok — privatna verzija</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f3f8f6;background:#0d2224;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#173a38,#0c2227 67%)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}.app{max-width:500px;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;gap:20px}.top{display:flex;align-items:center;justify-content:space-between}.muted{color:#a5c0b9}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#95cdb8}.title{font-weight:800;font-size:28px;letter-spacing:-1.1px;margin:4px 0}.iconbutton{border:1px solid #42625e;border-radius:13px;background:#1c4240;color:white;min-width:43px;height:42px}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{border:1px solid #45615f;border-radius:19px;padding:19px 15px;background:#193b3b}.team.selected{outline:2px solid #a7e3bd;background:#254d49}.team label{font-size:13px;color:#b1ccc5;font-weight:700;letter-spacing:.1em}.team .score{font-size:41px;letter-spacing:-2px;font-weight:800;margin-top:7px}.team .round{font-size:12px;color:#b6d0ca;margin-top:2px}.switch{display:flex;border:1px solid #45625e;background:#0b2427;padding:5px;border-radius:17px}.switch button{width:50%;border:0;background:transparent;color:#b0c9c2;padding:12px;font-weight:750;border-radius:12px}.switch button.on{background:#c5f0d7;color:#16382c;box-shadow:0 2px 8px #0004}.panel{background:#f7f9f4;color:#183733;border-radius:23px;padding:17px;box-shadow:0 13px 40px #0003}.panel h2{font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:#68817b;margin:0 0 13px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.entry{background:#e8eee7;color:#25433f;border:2px solid transparent;border-radius:15px;padding:12px;text-align:center;min-height:78px}.entry.active{border-color:#298f70;background:#d9f5e7}.entry small{display:block;font-weight:800;font-size:12px;letter-spacing:1px;margin-bottom:5px}.entry b{font-size:30px;font-weight:850;display:block}.hint{color:#799088;font-size:12px;margin:10px 2px 0}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.key{border:0;border-radius:14px;background:#e8eee8;color:#1e413a;min-height:56px;font-size:26px;font-weight:700}.key:active{background:#bcd7c5}.key.secondary{background:#d2e4d8;font-size:22px}.key.back{background:#f0dbd2;color:#813e2a}.primary{background:#bbedcf;color:#123d32;border:0;border-radius:16px;min-height:54px;font-size:16px;font-weight:800;padding:12px 18px}.secondaryBtn{background:#234a47;color:#d9f4e7;border:1px solid #55756c;border-radius:15px;padding:12px 14px;font-weight:750}.actions{display:flex;gap:10px}.actions>*{flex:1}.footnote{text-align:center;color:#92aba4;font-size:12px}.roundlist{flex:1;display:flex;flex-direction:column;gap:9px;min-height:80px}.roundline{display:grid;grid-template-columns:45px 1fr 1fr 48px;align-items:center;border:1px solid #355652;background:#183b3a;border-radius:14px;padding:14px 11px;gap:6px;font-size:18px}.roundline .index{font-size:12px;color:#abc4be}.roundline .points{text-align:center;font-weight:700}.roundline .points span{display:block;font-size:11px;color:#9cc2ad;font-weight:500}.roundline .edit{font-size:13px;background:#2c544d;color:#d8f2e4;border:0;border-radius:8px;padding:9px 4px}.summary{border:1px solid #4d7469;background:#1b4841;border-radius:16px;padding:16px;text-align:center}.summary strong{font-size:25px}.summary small{display:block;color:#b1d0c3;margin-bottom:9px}.footer{margin-top:auto;display:flex;flex-direction:column;gap:10px}.empty{text-align:center;color:#a6bfb8;padding:36px 10px}.overlay{position:fixed;inset:0;background:#061918ca;display:flex;align-items:center;justify-content:center;padding:22px;z-index:10}.modal{width:100%;max-width:440px;background:#f7fbf6;border-radius:22px;color:#193b35;padding:22px;max-height:90dvh;overflow:auto}.modal h2{margin:0 0 12px}.modal p{line-height:1.45}.modal button{margin-top:8px;width:100%}.modal input{width:100%;padding:13px;border:1px solid #abc3b7;border-radius:12px;font-size:18px}.tiny{font-size:12px;color:#75867e}.hidden{display:none!important}.spacer{flex:1}
</style></head><body><main id="app"></main><div id="dialog" class="overlay hidden"></div><input type="file" id="upload" class="hidden" accept="application/json,.json"><script>
(()=>{'use strict';const K='bela-blok-private-v1',el=document.getElementById('app'),overlay=document.getElementById('dialog');const blank=()=>({rounds:[],winner:null,created:new Date().toISOString()});const init=()=>({matches:[blank()],active:0,mode:'game',focused:'mi',game:{mi:'',vi:''},zvanje:{mi:'',vi:''},screen:'entry',editing:null,target:1001});let s;try{s=JSON.parse(localStorage.getItem(K))||init()}catch{s=init()}if(!Array.isArray(s.matches)||!s.matches.length)s=init();s.mode=s.mode||'game';s.focused=s.focused||'mi';s.game=s.game||{mi:'',vi:''};s.zvanje=s.zvanje||{mi:'',vi:''};s.screen=s.screen||'entry';s.target=Number(s.target)||1001;const current=()=>s.matches[s.active]||s.matches[0];const sum=(r,k)=>r.reduce((a,b)=>a+b[k].game+b[k].zvanje,0);const calcTotals=()=>({mi:sum(current().rounds,'mi'),vi:sum(current().rounds,'vi')});const fmt=x=>x===''?'—':String(x);function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){alert('Spremanje nije uspjelo. Provjeri slobodan prostor ili Safari postavke.')}}function render(){const totals=calcTotals(),cur=current(),wins={mi:s.matches.filter(m=>m.winner==='mi').length,vi:s.matches.filter(m=>m.winner==='vi').length};el.innerHTML=`<div class="app"><header class="top"><div><div class="eyebrow">Privatni blok • bez interneta</div><h1 class="title">Bela Blok</h1></div><button class="iconbutton" data-act="settings" aria-label="Postavke">⚙</button></header><section class="scoreboard"><div class="team"><label>MI</label><div class="score">${totals.mi}</div><div class="round">Ukupno bodova</div></div><div class="team"><label>VI</label><div class="score">${totals.vi}</div><div class="round">Ukupno bodova</div></div></section>${s.screen==='entry'?entryHTML():listHTML(wins)}<div class="footnote">Sve se čuva na ovom uređaju.</div></div>`;save()}
function entryHTML(){let mode=s.mode,fields=s[mode];return `<div class="switch"><button class="${mode==='game'?'on':''}" data-act="mode" data-value="game">IGRA</button><button class="${mode==='zvanje'?'on':''}" data-act="mode" data-value="zvanje">ZVANJE</button></div><div class="panel"><h2>${s.editing!==null?'Uređivanje runde '+(s.editing+1):'Nova runda • '+(current().rounds.length+1)}</h2><div class="inputs"><button class="entry ${s.focused==='mi'?'active':''}" data-act="focus" data-value="mi"><small>MI</small><b>${fmt(fields.mi)}</b></button><button class="entry ${s.focused==='vi'?'active':''}" data-act="focus" data-value="vi"><small>VI</small><b>${mode==='game'&&fields.mi!==''&&fields.vi===''?162-Number(fields.mi):fmt(fields.vi)}</b></button></div><p class="hint">${mode==='game'?'Unesi osvojene bodove. Drugoj ekipi automatski pripada ostatak od 162. Za pad možeš ručno promijeniti obje ekipe.':'Zvanje upisuješ slobodno — bez unaprijed ponuđenih vrijednosti ili ograničenja.'}</p><div class="keypad">${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(n=>`<button class="key ${n==='C'?'back':n==='⌫'?'secondary':''}" data-act="key" data-value="${n}">${n}</button>`).join('')}</div></div><div class="footer"><div class="actions"><button class="secondaryBtn" data-act="list">← Popis</button><button class="primary" data-act="commit">${s.editing!==null?'Spremi izmjene':'✓ Završi rundu'}</button></div></div>`}
function listHTML(wins){const cur=current(),t=calcTotals(),done=!!cur.winner;return `<div class="top"><div><div class="eyebrow">Pregled</div><h2 style="margin:4px 0">Runde ${cur.rounds.length}</h2></div><button class="secondaryBtn" data-act="history">Povijest</button></div><div class="roundlist">${cur.rounds.length?cur.rounds.map((r,i)=>`<div class="roundline"><div class="index">#${i+1}</div><div class="points">${r.mi.game+r.mi.zvanje}<span>${r.mi.game}${r.mi.zvanje?' + '+r.mi.zvanje:''}</span></div><div class="points">${r.vi.game+r.vi.zvanje}<span>${r.vi.game}${r.vi.zvanje?' + '+r.vi.zvanje:''}</span></div><button class="edit" data-act="edit" data-value="${i}">Uredi</button></div>`).join(''):'<div class="empty">Još nema upisanih rundi.</div>'}</div>${done?`<div class="summary"><small>Partija završena · pobjednik ${cur.winner.toUpperCase()}</small><strong>MI ${wins.mi} &nbsp; VI ${wins.vi}</strong><div class="tiny" style="color:#b7d3c7;margin-top:8px">Rezultat partija</div></div>`:''}<div class="footer">${done?'<button class="primary" data-act="newmatch">Nova partija</button>':'<button class="primary" data-act="newround">+ Nova igra</button>'}<div class="actions"><button class="secondaryBtn" data-act="history">Partije</button><button class="secondaryBtn" data-act="undo">Obriši zadnju rundu</button></div></div>`}
function resetEntry(){s.game={mi:'',vi:''};s.zvanje={mi:'',vi:''};s.mode='game';s.focused='mi';s.editing=null}function newRound(){resetEntry();s.screen='entry';render()}
function commit(){const f=s.game,z=s.zvanje;const a=f.mi===''?null:Number(f.mi),b=f.vi===''?null:Number(f.vi);if(a===null&&b===null){toast('Upiši bodove barem jedne ekipe.');return}let mi=a,vi=b;if(mi===null)mi=162-vi;if(vi===null)vi=162-mi;if(!Number.isSafeInteger(mi)||!Number.isSafeInteger(vi)||mi<0||vi<0){toast('Neispravni bodovi igre.');return}const row={mi:{game:mi,zvanje:Number(z.mi)||0},vi:{game:vi,zvanje:Number(z.vi)||0}};const r=current().rounds;if(s.editing!==null)r[s.editing]=row;else r.push(row);const t=calcTotals();current().winner=(t.mi>s.target||t.vi>s.target)?(t.mi===t.vi?null:t.mi>t.vi?'mi':'vi'):null;resetEntry();s.screen='list';render()}
function toast(message){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="modal"><h2>Obavijest</h2><p>${message}</p><button class="primary" data-act="close">U redu</button></div>`}
function confirmBox(title,body,yes){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="modal"><h2>${title}</h2><p>${body}</p><button class="primary" data-act="${yes}">Potvrdi</button><button class="secondaryBtn" data-act="close">Odustani</button></div>`}
function history(){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="modal"><h2>Povijest partija</h2><p class="tiny">Sve partije na ovom uređaju (${s.matches.length}).</p>${s.matches.map((m,i)=>`<button class="secondaryBtn" data-act="openmatch" data-value="${i}" style="display:flex;justify-content:space-between;align-items:center"><span>Partija ${i+1} • ${new Date(m.created).toLocaleDateString('hr-HR')} ${i===s.active?'(trenutna)':''}</span><b>${sum(m.rounds,'mi')} : ${sum(m.rounds,'vi')}</b></button>`).join('')}<button class="primary" data-act="close">Zatvori</button></div>`}
function settings(){overlay.classList.remove('hidden');overlay.innerHTML=`<div class="modal"><h2>Postavke</h2><p>Cilj za pobjedu (pobjeda kada ekipa <b>pređe</b> cilj):</p><input id="target" type="number" min="1" value="${s.target}"><button class="primary" data-act="target">Spremi cilj</button><button class="secondaryBtn" data-act="export">Izvezi sigurnosnu kopiju</button><button class="secondaryBtn" data-act="import">Uvezi sigurnosnu kopiju</button><p class="tiny">Podaci se čuvaju u Safariju / instaliranoj web aplikaciji. Brisanje podataka preglednika može ih izbrisati, zato povremeno izvezi kopiju.</p><button class="secondaryBtn" data-act="close">Zatvori</button></div>`}
function exportJSON(){const blob=new Blob([JSON.stringify({format:'bela-blok-private-v1',data:s},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bela-blok-kopija-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);overlay.classList.add('hidden')}
function run(act,v){switch(act){case 'mode':s.mode=v;render();break;case 'focus':s.focused=v;render();break;case 'key':{const f=s[s.mode];let val=String(f[s.focused]||'');if(v==='C')val='';else if(v==='⌫')val=val.slice(0,-1);else if(val.length<9)val=val+v;f[s.focused]=val;render();break}case 'commit':commit();break;case 'list':s.screen='list';render();break;case 'newround':newRound();break;case 'edit':{let r=current().rounds[Number(v)];s.game={mi:String(r.mi.game),vi:String(r.vi.game)};s.zvanje={mi:r.mi.zvanje?String(r.mi.zvanje):'',vi:r.vi.zvanje?String(r.vi.zvanje):''};s.editing=Number(v);s.mode='game';s.focused='mi';s.screen='entry';render();break}case 'newmatch':s.matches.push(blank());s.active=s.matches.length-1;newRound();break;case 'undo':if(!current().rounds.length)return;confirmBox('Izbrisati zadnju rundu?','Ovo će ukloniti posljednji zapis.','doUndo');break;case 'doUndo':current().rounds.pop();current().winner=null;overlay.classList.add('hidden');render();break;case 'history':history();break;case 'openmatch':s.active=Number(v);resetEntry();s.screen='list';overlay.classList.add('hidden');render();break;case 'settings':settings();break;case 'target':{const n=Number(document.getElementById('target').value);if(Number.isSafeInteger(n)&&n>0){s.target=n;overlay.classList.add('hidden');render()}else toast('Unesi ispravan cilj.');break}case 'export':exportJSON();break;case 'import':document.getElementById('upload').click();break;case 'close':overlay.classList.add('hidden');break}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)run(b.dataset.act,b.dataset.value)});document.getElementById('upload').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const dat=JSON.parse(await f.text());if(dat.format!=='bela-blok-private-v1'||!Array.isArray(dat.data.matches))throw Error('format');s=dat.data;s.active=Math.min(Math.max(0,Number(s.active)||0),s.matches.length-1);s.screen='list';resetEntry();overlay.classList.add('hidden');render()}catch{toast('Datoteka nije valjana sigurnosna kopija.')}e.target.value=''});window.addEventListener('keydown',e=>{if(overlay.classList.contains('hidden')&&s.screen==='entry'&&/^[0-9]$/.test(e.key))run('key',e.key);else if(overlay.classList.contains('hidden')&&s.screen==='entry'&&e.key==='Backspace')run('key','⌫')});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();</script></body></html>
